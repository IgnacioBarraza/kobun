[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kobun"
dynamic = ["version"]
description = "Desktop utility to split PDFs by page ranges"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ignacio Barraza" }]
keywords = ["pdf", "split", "desktop", "qt", "pyside6"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]

dependencies = [
    "PySide6>=6.6,<7",
    "pymupdf>=1.24,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# PyInstaller is not a dependency of the app: it is only needed to produce the
# executable, and must not travel to the end user.
build = ["pyinstaller>=6.0"]
# Only CI uses this, to version and publish.
release = ["python-semantic-release>=10,<11"]

# gui-scripts and not scripts: on Windows it produces a launcher with no console behind it.
[project.gui-scripts]
kobun = "kobun.presentation.qt.qt_app:run"

[project.urls]
Repository = "https://github.com/IgnacioBarraza/kobun"

[tool.setuptools.dynamic]
# A single source of truth for the version: the package.
version = { attr = "kobun.__version__" }

[tool.setuptools.packages.find]
include = ["kobun*"]
exclude = ["kobun.tests*"]

# Themes, icons and the combo box arrows are not .py, so without declaring them
# they fall out of any distribution and the app would install with no colours and
# no icon.
[tool.setuptools.package-data]
"kobun.shared" = [
    "themes/*.json",
    "themes/icons/*.svg",
    "icons/*.png",
    "icons/*.ico",
]

[tool.pytest.ini_options]
testpaths = ["kobun/tests"]

# =============================================================================
# Automatic versioning
# =============================================================================
# The version is not bumped by hand: it comes from the commits. `feat:` raises
# the minor, `fix:`/`perf:` the patch, everything else publishes nothing. This is
# the semantic-release scheme, using the Python implementation so as not to drag
# Node into a project that does not need it.
[tool.semantic_release]
# The same file setuptools reads: one source of truth for the version, which is
# also the one the app shows in its sidebar.
version_variables = [
    "kobun/__init__.py:__version__",
    # The Windows installer declares its own version, and falling behind is not
    # noticed until someone installs a setup labelled with an old one. The pattern
    # accepts C-macro style definitions, so #define is enough.
    "packaging/kobun.iss:MyAppVersion",
]
tag_format = "v{version}"

# 0.x is a valid version: without this the first automatic release would jump
# straight to 1.0.0.
allow_zero_version = true
# Below 1.0.0 a breaking change does not justify a major: the API has not
# promised stability yet.
major_on_zero = false

# The workflow builds the binaries on each system; semantic-release only
# versions, so it has nothing to build here.
build_command = ""

# The message is conventional on purpose: if commit format is ever validated,
# the one the release writes itself cannot be the one that fails.
commit_message = "chore(release): v{version} [skip ci]"
# The commit is pushed by the kobun-release-bot GitHub App, the one the ruleset
# on main lets through; the number is its bot user id, which is what makes GitHub
# attach its avatar to the commit.
commit_author = "kobun-release-bot[bot] <318829460+kobun-release-bot[bot]@users.noreply.github.com>"

# main publishes definitive versions; develop publishes numbered prereleases
# (0.2.0-alpha.1, .2, …) so the binaries can be tried before they are final.
[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.develop]
match = "develop"
prerelease = true
prerelease_token = "alpha"

[tool.semantic_release.changelog]
# "update" inserts the new version and leaves what is already written alone.
mode = "update"
# The release's own commits are not changes to the project.
exclude_commit_patterns = ['^chore\(release\):']

[tool.semantic_release.changelog.default_templates]
changelog_file = "docs/changelog.md"

# The workflow uploads the release assets with `gh`, because they are built on
# different runners and in a later step.
[tool.semantic_release.publish]
upload_to_vcs_release = false
